{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h1 style="margin-bottom: 2rem; text-align: center;">
        {{ '編輯食譜' if recipe and recipe.id else '新增食譜' }}
    </h1>

    <form method="POST">
        <div class="form-group">
            <label class="form-label" for="title">食譜標題 <span style="color: #ef4444;">*</span></label>
            <input type="text" id="title" name="title" class="form-control" required
                   value="{{ recipe.title if recipe else '' }}"
                   placeholder="例如：紅燒牛肉麵">
        </div>

        <div class="form-group">
            <label class="form-label" for="category_id">分類 (選填)</label>
            <select id="category_id" name="category_id" class="form-control">
                <option value="">-- 選擇分類 --</option>
                {% for category in categories %}
                <option value="{{ category.id }}" 
                    {% if recipe and recipe.category_id == category.id %}selected{% endif %}>
                    {{ category.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" for="ingredients">材料清單 <span style="color: #ef4444;">*</span></label>
            <textarea id="ingredients" name="ingredients" class="form-control" required
                      placeholder="請列出所需材料與份量&#10;例如：&#10;- 牛肉 500g&#10;- 蔥 2根&#10;- 醬油 3大匙">{{ recipe.ingredients if recipe else '' }}</textarea>
        </div>

        <div class="form-group">
            <label class="form-label" for="steps">作法步驟 <span style="color: #ef4444;">*</span></label>
            <textarea id="steps" name="steps" class="form-control" required style="min-height: 250px;"
                      placeholder="請描述製作步驟&#10;例如：&#10;1. 牛肉切塊川燙備用&#10;2. 熱鍋爆香蔥薑蒜&#10;3. 加入牛肉與醬油翻炒">{{ recipe.steps if recipe else '' }}</textarea>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('recipe.recipe_detail', id=recipe.id) if recipe and recipe.id else url_for('main.index') }}" class="btn-secondary">取消</a>
            <button type="submit" class="btn-primary">儲存食譜</button>
        </div>
    </form>
</div>
{% endblock %}
